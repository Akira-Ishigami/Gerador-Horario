<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />

    <title>Horária — Gerador de horário escolar automático</title>
    <meta
      name="description"
      content="Crie a grade horária da sua escola em minutos, sem conflitos de professores. Planos a partir de R$ 49,90/mês."
    />
    <meta name="keywords" content="gerador de horário escolar, grade horária, horário escolar automático, software para escolas" />
    <meta name="author" content="Horária" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Unbounded:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Horária",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Gerador automático de horários escolares que elimina conflitos de professores e turmas.",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "BRL",
          "lowPrice": "49.90",
          "highPrice": "179.90"
        }
      }
    </script>

    <script>
      // Evita "flash" de tema errado: aplica a classe antes do primeiro paint.
      (function () {
        try {
          var saved = localStorage.getItem("horaria_theme")
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var isDark = saved ? saved === "dark" : prefersDark
          if (isDark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
